<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>沖繩 7天6夜行程簡表</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 1.15em;
      line-height: 1.6;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--primary-color);
      color: #ffffff;
      text-align: center;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: bold;
    }

    /* 修復導覽分頁按鈕不重疊 */
    .nav-tabs {
      display: flex;
      overflow-x: auto;
      background-color: #ffffff;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }

    .tab-button {
      flex: 0 0 auto; /* 避免按鈕互相擠壓 */
      padding: 12px 16px;
      border: none;
      background: none;
      font-size: 1.05em;
      font-weight: bold;
      color: #64748b;
      cursor: pointer;
      border-bottom: 4px solid transparent;
    }

    .tab-button.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      background-color: #f0f9ff;
    }

    .container {
      max-width: 700px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 卡片與內容 */
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      margin-bottom: 20px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #bae6fd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 1.1em;
    }

    td {
      padding: 8px 6px;
      vertical-align: top;
      border-bottom: 1px solid #f1f5f9;
      white-space: pre-line;
    }

    .time-col {
      width: 110px;
      font-weight: bold;
      color: #0369a1;
    }

    /* 圖片排版 (寬度 100%, 高度 300px~400px, object-fit: cover) */
    .img-box {
      width: 100%;
      height: 320px;
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f1f5f9;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }

    /* Modal Lightbox */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal img {
      max-width: 95%;
      max-height: 90%;
      border-radius: 6px;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

    <h1>沖繩 7天6夜行程簡表</h1>
  </header>
